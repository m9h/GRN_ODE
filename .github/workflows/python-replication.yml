name: Python replication
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  catalog-paired-solver-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-recovery-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test
      - name: Check the previously failing François case
        run: |
          # The catalog command returns 1 for an intentionally partial selection.
          # Explicitly validate its single case instead of treating that code as success.
          uv run --locked python -m grn_memory.catalog_paired --network 25 --case A__up--gB__up --workers 1 --output results/catalog-paired-recovery-ci || test "$?" -eq 1
          uv run --locked python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path("results/catalog-paired-recovery-ci")
          report = json.loads((root / "BIOMD0000000539.json").read_text())
          assert set(report["cases"]) == {"A__up--gB__up"}
          assert report["passed_cases"] == report["evaluated_cases"] == 1
          assert report["cases"]["A__up--gB__up"]["status"] == "passed"
          assert report["control_comparison"]["passed"]
          with gzip.open(root / "BIOMD0000000539-branches.jsonl.gz", "rt") as stream:
              branches = [json.loads(line) for line in stream]
          assert len(branches) == 12 and all(branch["passed"] for branch in branches)
          print("François regression: 1 selected case, all 12 branches passed; full coverage not claimed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-paired-solver-regression
          path: python/results/catalog-paired-recovery-ci/
  catalog-breaking-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-breaking-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra delay
      - run: uv run --locked --extra test --extra delay python -m pytest -q tests/test_catalog_breaking.py tests/test_protocol_retries.py
      - name: Check all eight Goldbeter explicit-pool refinement recoveries
        run: |
          uv run --locked python scripts/diagnose_breaking_refinement.py --evidence results/catalog-breaking-goldbeter4-refinement/source-evidence.json --output results/catalog-breaking-refinement-ci
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/catalog-breaking-refinement-ci")
          report = json.loads((root / "report.json").read_text())
          assert report["status"] == "completed"
          assert report["confirmed_branches"] == report["expected_branches"] == 8
          for row in report["branches"]:
              branch = json.loads((root / row["file"]).read_text())
              assert branch["refinement_confirmed"]
              for engine in ("roadrunner", "copasi"):
                  for request in ("tight", "tighter"):
                      run = branch["integrations"][engine + "_" + request]
                      assert run["completed"] and run["samples"] == 221001
          print("All eight Goldbeter branches pass both tighter cross-engine requests and refinement.")
          PY
      - run: uv run --locked --extra delay python -m grn_memory.catalog_breaking --network 14 --network 18 --workers 2 --output results/catalog-breaking-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-breaking-smoke-validation
          path: |
            python/results/catalog-breaking-ci/
            python/results/catalog-breaking-refinement-ci/
  catalog-repeated:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-repeated-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra delay
      - run: uv run --locked --extra test --extra delay python -m pytest -q tests/test_catalog_repeated.py tests/test_timed_drives.py
      - run: uv run --locked --extra delay python -m grn_memory.catalog_repeated --workers 2 --output results/catalog-repeated-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-repeated-validation
          path: python/results/catalog-repeated-ci/
  catalog-paired-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-paired-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra delay
      - run: uv run --locked --extra test --extra delay python -m pytest -q tests/test_catalog_paired.py
      - run: uv run --locked --extra delay python -m grn_memory.catalog_paired --network 14 --network 16 --network 19 --workers 2 --output results/catalog-paired-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-paired-smoke-validation
          path: python/results/catalog-paired-ci/
  catalog-jax:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-jax-mpl
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - run: uv run --locked --extra test --extra jaxkineticmodel python -m pytest -q tests/test_catalog_jax.py tests/test_jax_protocols.py tests/test_scipy_reference.py
      - run: uv run --locked --extra jaxkineticmodel python -m grn_memory.catalog_jax --workers 2 --expect-unsupported 1 --expect-unsupported 6 --expect-unsupported 14 --output results/catalog-jax-ci
      - name: Check the difficult Rohwer reset branch with Newton implicit solves
        run: |
          uv run --locked --extra jaxkineticmodel python scripts/diagnose_jax_paired.py --model 38 --root-finder Newton --root-find-max-steps 20 --branch 698ea588e8ce617393a9d712c09db85d171278dff6e9291ce785e1e3f71924df --output results/catalog-paired-jax-newton-ci
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/catalog-paired-jax-newton-ci")
          report = json.loads((root / "report.json").read_text())
          assert report["status"] == "completed"
          assert report["confirmed_branches"] == report["expected_branches"] == 1
          branch = json.loads((root / report["branches"][0]["file"]).read_text())
          assert len(branch["comparisons"]) == 5
          assert all(c["passed"] and c["samples"] == 30001 for c in branch["comparisons"].values())
          print("Rohwer: both JAX and RoadRunner requests and all five comparisons pass.")
          PY
      - name: Check a difficult Vilar branch with the Radau reference
        run: |
          uv run --locked --extra test --extra jaxkineticmodel python scripts/diagnose_scipy_paired.py --model 35 --branch 223eba38bdcf2bb1ec64ac048b179d978cf09281f6fa0f0afd0501d2ae4705a3 --output results/catalog-paired-scipy-ci
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/catalog-paired-scipy-ci")
          report = json.loads((root / "report.json").read_text())
          assert report["status"] == "completed"
          assert report["confirmed_branches"] == report["expected_branches"] == 1
          branch = json.loads((root / report["branches"][0]["file"]).read_text())
          assert len(branch["comparisons"]) == 5
          assert all(c["passed"] and c["samples"] == 30001 for c in branch["comparisons"].values())
          print("Vilar: both Radau and tighter RoadRunner requests and all five comparisons pass.")
          PY
      - name: Audit the Vilar branch without promoting incomplete cases
        run: |
          uv run --locked --extra test --extra jaxkineticmodel python scripts/recover_scipy_paired_cases.py --model 35 --diagnostics results/catalog-paired-scipy-ci --output results/catalog-paired-scipy-case-audit-ci/report.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/catalog-paired-scipy-case-audit-ci/report.json").read_text())
          assert report["required_branch_count"] == 58
          assert report["confirmed_branches"] == 1
          assert report["recovered_cases"] == 0
          assert report["original_passed_cases"] == report["combined_passed_cases"] == 136
          assert not report["all_cases_validated"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-jax-validation
          path: |
            python/results/catalog-jax-ci/
            python/results/catalog-paired-jax-newton-ci/
            python/results/catalog-paired-scipy-ci/
            python/results/catalog-paired-scipy-case-audit-ci/
  catalog-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-memory-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra delay
      - run: uv run --locked --extra test --extra delay python -m pytest -q tests/test_native_protocols.py tests/test_delay_protocols.py tests/test_catalog_memory.py
      - run: uv run --locked --extra delay python -m grn_memory.catalog_memory --workers 2 --output results/catalog-memory-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-memory-validation
          path: python/results/catalog-memory-ci/
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-catalog-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra delay
      - run: uv run --locked --extra test --extra delay python -m pytest -q tests/test_native_kinetics.py tests/test_delay_kinetics.py
      - run: uv run --locked --extra delay python -m grn_memory.catalog_validation --workers 2 --output results/catalog-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-kinetics-validation
          path: python/results/catalog-ci/
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # RoadRunner's Linux wheel links libpython; use setup-python's shared build.
      - run: uv sync --python python --locked --extra test
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m grn_memory.suite --no-traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replication-results
          path: |
            python/results/report.json
            python/results/*.png
  jaxkineticmodel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/grn-jkm-mpl
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - run: uv run --locked --extra test --extra jaxkineticmodel python -m pytest -q
      - run: uv run --locked --extra jaxkineticmodel python -m grn_memory.suite --engine all --output results/jaxkineticmodel --no-traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaxkineticmodel-replication
          path: python/results/jaxkineticmodel/

name: Preserve Ciliberto original archives

on:
  push:
    paths:
      - '.github/workflows/ciliberto-archive-preservation.yml'
      - 'python/scripts/archive_release_chunks.py'
      - 'python/scripts/preserve_ciliberto_archives.py'
      - 'python/tests/test_ciliberto_release_chunks.py'
      - 'python/tests/test_ciliberto_archive_plan.py'
      - 'python/results/catalog-breaking-ciliberto-archive-preservation-20261126/**'
  workflow_dispatch:
    inputs:
      partitions:
        description: 'Archive transfer indices only; all 256 scientific partitions remain required'
        type: string
        required: true
        default: '[0]'

permissions:
  contents: write
  actions: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - name: Test unchanged scientific audit and bounded archive transport
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python -m pytest -q
          tests/test_ciliberto_release_chunks.py tests/test_ciliberto_full_case_audit.py
          tests/test_scipy_breaking_case_audit.py tests/test_ciliberto_later_controls.py
          tests/test_ciliberto_full_collection.py tests/test_ciliberto_archive_plan.py
      - name: Verify full producer scope and all pinned archive identities
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel
          python scripts/preserve_ciliberto_archives.py check
      - name: Prepare archive releases and transfer matrix
        if: github.event_name == 'workflow_dispatch'
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_PARTITIONS: ${{ inputs.partitions }}
        run: >-
          python scripts/preserve_ciliberto_archives.py matrix
          --partitions "$TRANSFER_PARTITIONS" --create-releases
  preserve:
    if: github.event_name == 'workflow_dispatch'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validation.outputs.matrix) }}
    name: preserve-ciliberto-archive-${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Preserve and freshly verify the original ZIP in bounded chunks
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_INDEX: ${{ matrix.index }}
        run: >-
          python python/scripts/preserve_ciliberto_archives.py publish
          --index "$ARCHIVE_INDEX" --output "$RUNNER_TEMP/ciliberto-archive"
      - name: Retain transport proof, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciliberto-archive-preservation-${{ matrix.index }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ciliberto-archive/*.json
            ${{ runner.temp }}/ciliberto-archive/publication/*.json
          if-no-files-found: warn
          retention-days: 90

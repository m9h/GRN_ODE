name: Ciliberto complete failure inventory

on:
  push:
    paths:
      - '.github/workflows/ciliberto-full-inventory.yml'
      - 'python/scripts/prepare_ciliberto_full_inventory.py'
      - 'python/scripts/plan_ciliberto_full_computation.py'
      - 'python/tests/test_ciliberto_full_inventory.py'
      - 'python/results/catalog-breaking-ciliberto-full-inventory-20261118/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - name: Check full inventory construction and unchanged complete-case auditing
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python -m pytest -q
          tests/test_ciliberto_full_inventory.py tests/test_scipy_breaking_case_audit.py

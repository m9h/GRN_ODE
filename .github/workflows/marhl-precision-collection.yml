name: Marhl complete artifact and case audit
permissions:
  contents: read
on:
  push:
    branches: [kinetics-marhl-precision-collection]
  pull_request:
    paths:
      - 'python/grn_memory/marhl_collection.py'
      - 'python/grn_memory/marhl_cases.py'
      - 'python/scripts/collect_marhl_precision.py'
      - 'python/tests/test_marhl_collection.py'
      - 'python/tests/test_marhl_cases.py'
      - '.github/workflows/marhl-precision-collection.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete-artifact-and-case-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    env:
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact numerical producer and original evidence revisions
        run: |
          git fetch --no-tags --depth=1 origin a3778b8cbb8bfdc16a9ddd4bbe84dd213fdf1022
          git fetch --no-tags --depth=1 origin 079e35d8bc0795f427b6cb5b8514f35830f01909
          git fetch --no-tags --depth=1 origin 70a3afad61357e94873ff62a7300c099b4c7ae3e
          git fetch --no-tags --depth=1 origin 2e7327b0d273f4b33bdd8aa37601c1a497854a2a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv-marhl-audit --python python
      - run: uv pip install --python .venv-marhl-audit/bin/python -r environments/marhl-checkpoint-requirements.txt
      - name: Verify original scope, transport, continuation prefixes and case mathematics
        run: >-
          .venv-marhl-audit/bin/python -B -m pytest -q
          tests/test_marhl_collection.py tests/test_marhl_cases.py
          --junitxml=results/marhl-collection-tests.xml
      - name: Reproduce the complete original Marhl case inventory
        run: .venv-marhl-audit/bin/python -B scripts/collect_marhl_precision.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marhl-collection-test-report
          path: python/results/marhl-collection-tests.xml

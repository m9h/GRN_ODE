name: Rohwer later-control artifact collection

on:
  push:
    paths:
      - '.github/workflows/rohwer-later-collection.yml'
      - 'python/scripts/collect_rohwer_later_controls.py'
      - 'python/tests/test_rohwer_later_collection.py'
      - 'python/results/catalog-breaking-rohwer-later-controls-20261118/COLLECTION.md'
      - 'python/results/catalog-breaking-rohwer-later-controls-20261118/collector-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - name: Test fixed job selection, full arrays and interrupted evidence
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python -m pytest -q
          tests/test_rohwer_later_collection.py tests/test_rohwer_later_controls.py
          tests/test_rohwer_breaking_collection.py
      - name: Download pinned complete case inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download kinetics-rohwer-full-controls-20261118
          --repo m9h/GRN_ODE --dir results/rohwer-full-controls-download
      - name: Verify frozen plan, model and actual numerical runtime without integrating
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python scripts/run_rohwer_later_controls.py
          check --plan results/catalog-breaking-rohwer-later-controls-20261118/plan.json
          --plan-sha256 571526958023ac93789c4e48924ceb44106e378a1520339569e9bb818e84d98e
          --inputs results/rohwer-full-controls-download

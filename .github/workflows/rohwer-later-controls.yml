name: Rohwer complete remaining controls

on:
  push:
    paths:
      - '.github/workflows/rohwer-later-controls.yml'
      - 'python/scripts/run_rohwer_later_controls.py'
      - 'python/scripts/audit_rohwer_later_controls.py'
      - 'python/tests/test_rohwer_later_controls.py'
      - 'python/results/catalog-breaking-rohwer-later-controls-20261118/**'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [test, compute]
        default: test
        description: Validate or execute one fixed batch of the 10924 remaining controls

      batch:
        type: choice
        options: ['0', '1']
        default: '0'
        description: Fixed batch (0 covers partitions 0-255; 1 covers 256-511)

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      BATCH_INDEX: ${{ inputs.batch || '0' }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - name: Test full scope, original worker and independent array auditing
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python -m pytest -q
          tests/test_rohwer_later_controls.py tests/test_rohwer_full_controls.py
          tests/test_scipy_breaking_case_audit.py tests/test_scipy_breaking_controls.py
      - name: Download pinned complete case inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download kinetics-rohwer-full-controls-20261118
          --repo m9h/GRN_ODE --dir results/rohwer-full-controls-download
      - name: Verify all original inputs, complete plan and actual numerical runtime
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python scripts/run_rohwer_later_controls.py
          check --plan results/catalog-breaking-rohwer-later-controls-20261118/plan.json
          --plan-sha256 571526958023ac93789c4e48924ceb44106e378a1520339569e9bb818e84d98e
          --inputs results/rohwer-full-controls-download
      - id: matrix
        name: Use every partition in the requested fixed batch
        run: |
          uv run --locked --extra test --extra jaxkineticmodel python - <<'PY'
          import json, os
          with open('results/catalog-breaking-rohwer-later-controls-20261118/plan.json') as stream:
              plan = json.load(stream)
          batch = int(os.environ['BATCH_INDEX'])
          assert batch in (0, 1)
          indices = plan['batches'][batch]['partition_indices']
          assert len(indices) == 256
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'index': indices}) + '\n')
          PY
  compute:
    if: ${{ inputs.operation == 'compute' }}
    needs: validation
    name: rohwer-later-controls-batch-${{ inputs.batch }}-partition-${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.validation.outputs.matrix) }}
    defaults:
      run:
        working-directory: python
    env:
      PARTITION_INDEX: ${{ matrix.index }}
      BATCH_INDEX: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python python --locked --extra test --extra jaxkineticmodel
      - name: Download pinned complete case inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download kinetics-rohwer-full-controls-20261118
          --repo m9h/GRN_ODE --dir results/rohwer-full-controls-download
      - name: Compute and independently audit all controls in this fixed partition
        run: >-
          uv run --locked --extra test --extra jaxkineticmodel python scripts/run_rohwer_later_controls.py
          compute --plan results/catalog-breaking-rohwer-later-controls-20261118/plan.json
          --plan-sha256 571526958023ac93789c4e48924ceb44106e378a1520339569e9bb818e84d98e
          --inputs results/rohwer-full-controls-download --batch "$BATCH_INDEX" --index "$PARTITION_INDEX" --budget 19200
          --output "results/rohwer-later-controls/partition-$PARTITION_INDEX"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rohwer-controls-BIOMD0000000038-batch-${{ inputs.batch }}-partition-${{ matrix.index }}-attempt-${{ github.run_attempt }}
          path: python/results/rohwer-later-controls/partition-${{ matrix.index }}/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
